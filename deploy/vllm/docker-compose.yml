services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN before starting vLLM}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command:
      - --model
      - google/gemma-4-E2B-it
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "8192"
      - --api-key
      - ${VLLM_API_KEY:?Set VLLM_API_KEY before starting vLLM}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  huggingface-cache:
