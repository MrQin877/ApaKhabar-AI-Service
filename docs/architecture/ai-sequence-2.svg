<rect x="454.70000000000005" y="408" width="270.59999999999997" height="24" fill="white"/>
<text x="590.0" y="425" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">4. Generation worker: POST /news/generate</text>
