<rect x="281.8" y="284" width="356.4" height="24" fill="white"/>
<text x="460.0" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">2. Load approved facts and relevant historical context</text>
