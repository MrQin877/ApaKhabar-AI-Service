<rect x="742.4" y="470" width="475.2" height="24" fill="white"/>
<text x="980.0" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">5. Understand request; plan research if additional evidence is available</text>
<line x1="1110.0" y1="567" x2="850.0" y2="567" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="824.9" y="532" width="310.2" height="24" fill="white"/>
<text x="980.0" y="549" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">6. Return format and up to three research tasks</text>
<rect x="25" y="605" width="1910" height="34" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="627" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a">LOOP — ReAct research, only when planned; shared tool-call limit</text>
<line x1="850.0" y1="691" x2="1110.0" y2="691" stroke="#475569" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="772.1" y="656" width="415.79999999999995" height="24" fill="white"/>
<text x="980.0" y="673" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">7. Choose next tool action using task, sources and observations</text>
<line x1="1110.0" y1="753" x2="850.0" y2="753" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="749.0" y="718" width="462.0" height="24" fill="white"/>
<text x="980.0" y="735" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">8. Return search, inspect, read-skill, permitted web search, or finish</text>
<line x1="850.0" y1="815" x2="1370.0" y2="815" stroke="#475569" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="971.4" y="780" width="277.2" height="24" fill="white"/>
<text x="1110.0" y="797" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">9. For library search: encode search query</text>
<line x1="1370.0" y1="877" x2="850.0" y2="877" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="1034.1" y="842" width="151.79999999999998" height="24" fill="white"/>
<text x="1110.0" y="859" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">10. Return query vector</text>
<line x1="850.0" y1="939" x2="1630.0" y2="939" stroke="#475569" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="1058.5" y="904" width="363.0" height="24" fill="white"/>
<text x="1240.0" y="921" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">11. Search with owner, approval and eligible-ID filters</text>
<line x1="1630.0" y1="1001" x2="850.0" y2="1001" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="1117.9" y="966" width="244.2" height="24" fill="white"/>
<text x="1240.0" y="983" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">12. Return relevant approved evidence</text>
<text x="862.0" y="1034" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">13. Record result or error; repeat action selection until finished</text>
