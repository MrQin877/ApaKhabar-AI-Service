<text x="38" y="193" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Prepare generation request</text>
<line x1="70.0" y1="257" x2="330.0" y2="257" stroke="#475569" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="74.60000000000001" y="222" width="250.79999999999998" height="24" fill="white"/>
<text x="200.0" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">1. Request news using selected sources</text>
