<rect x="304.9" y="346" width="310.2" height="24" fill="white"/>
<text x="460.0" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">3. Return source records and historical context</text>
