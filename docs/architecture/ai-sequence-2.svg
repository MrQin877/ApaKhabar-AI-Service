<text x="38" y="1123" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Check evidence and write</text>
<text x="862.0" y="1158" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">14. If web results exist: pause for source approval via Laravel</text>
<path d="M850.0,1185 h45 v14 h-45" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
<line x1="850.0" y1="1249" x2="1110.0" y2="1249" stroke="#475569" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="834.8" y="1214" width="290.4" height="24" fill="white"/>
<text x="980.0" y="1231" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">15. Check completeness and conflicting facts</text>
<line x1="1110.0" y1="1311" x2="850.0" y2="1311" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="805.1" y="1276" width="349.79999999999995" height="24" fill="white"/>
<text x="980.0" y="1293" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">16. Return known facts, missing details and conflicts</text>
<text x="862.0" y="1344" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">17. If required: pause for one clarification round via Laravel</text>
<path d="M850.0,1371 h45 v14 h-45" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
<line x1="850.0" y1="1435" x2="1110.0" y2="1435" stroke="#475569" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="791.9" y="1400" width="376.2" height="24" fill="white"/>
<text x="980.0" y="1417" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">18. Write draft from approved sources and editorial brief</text>
<line x1="1110.0" y1="1497" x2="850.0" y2="1497" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="874.4" y="1462" width="211.2" height="24" fill="white"/>
<text x="980.0" y="1479" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">19. Return draft with source IDs</text>
<line x1="850.0" y1="1559" x2="1890.0" y2="1559" stroke="#475569" stroke-dasharray="none" marker-end="url(#arrow)"/>
<rect x="1181.9" y="1524" width="376.2" height="24" fill="white"/>
<text x="1370.0" y="1541" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">20. Review draft against evidence; identify evidence gaps</text>
<line x1="1890.0" y1="1621" x2="850.0" y2="1621" stroke="#475569" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<rect x="1181.9" y="1586" width="376.2" height="24" fill="white"/>
<text x="1370.0" y="1603" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">21. Return claim checks, dimensions and revision findings</text>
<text x="862.0" y="1654" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">22. Apply deterministic checks; compute weighted quality score</text>
<path d="M850.0,1681 h45 v14 h-45" fill="none" stroke="#475569" marker-end="url(#arrow)"/>
<rect x="25" y="1721" width="1910" height="34" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="1743" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Continue with page 03 — review routing, replanning and human review</text>
<text x="35" y="1830" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#0f172a">Solid arrows: requests/actions   |   Dashed arrows: responses   |   Model names follow bundled launchers; deployments can override them.</text>
