<text x="35" y="38" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#0f172a">01 — Document extraction and approved indexing</text>
<text x="35" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="normal" fill="#0f172a">Upload does not imply drafting. Only moderator-approved information enters the agent knowledge index.</text>
