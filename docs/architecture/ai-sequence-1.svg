<rect x="76.68333333333335" y="222" width="250.79999999999998" height="24" fill="white"/>
<text x="202.08333333333334" y="239" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="normal" fill="#0f172a">1. Upload document and optional prompt</text>
