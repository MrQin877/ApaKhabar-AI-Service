<rect x="1220" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="1320" y="151" text-anchor="middle" font-family="Arial" font-size="14">Queue Worker</text>
<text x="1320" y="170" text-anchor="middle" font-family="Arial" font-size="14">SyncMetaInsights / MetaInsights</text>
<line x1="1710" y1="190" x2="1710" y2="2649" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="1610" y="125" width="200" height="65" fill="#dae8fc" stroke="#64748b"/>
<text x="1710" y="151" text-anchor="middle" font-family="Arial" font-size="14">Application Database</text>
<line x1="2100" y1="190" x2="2100" y2="2649" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="2000" y="125" width="200" height="65" fill="#fff2cc" stroke="#64748b"/>
<text x="2100" y="151" text-anchor="middle" font-family="Arial" font-size="14">Meta Graph API</text>
<rect x="534" y="225" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="150,225 540,225" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="345.0" y="221" text-anchor="middle" font-family="Arial" font-size="13">select accounts or request synchronization</text>
<rect x="924" y="365" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="540,365 930,365" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="735.0" y="361" text-anchor="middle" font-family="Arial" font-size="13">PUT /admin/analytics/meta (connection_ids)</text>
<rect x="1704" y="450" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,450 1710,450" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1320.0" y="446" text-anchor="middle" font-family="Arial" font-size="13">validate owned connections; one account per platform</text>
<polyline points="1710,535 930,535" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1320.0" y="531" text-anchor="middle" font-family="Arial" font-size="13">return validated connections</text>
