<text x="1320.0" y="616" text-anchor="middle" font-family="Arial" font-size="13">transaction: update analytics_settings; insert setting change</text>
<polyline points="1710,705 930,705" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1320.0" y="701" text-anchor="middle" font-family="Arial" font-size="13">commit configuration</text>
<line x1="40" y1="770" x2="2300" y2="770" stroke="#64748b" stroke-dasharray="6 4"/><text x="55" y="792" font-family="Arial" font-size="13">[manual refresh]</text>
<rect x="924" y="845" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="540,845 930,845" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="735.0" y="841" text-anchor="middle" font-family="Arial" font-size="13">POST /admin/analytics/meta/sync</text>
<rect x="924" y="973" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,948 975,948 975,973 930,973" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="985" y="926" text-anchor="start" font-family="Arial" font-size="13">authorize administrator; apply route</text>
<text x="985" y="944" text-anchor="start" font-family="Arial" font-size="13">throttle</text>
<rect x="1314" y="1073" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,1073 1320,1073" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1125.0" y="1069" text-anchor="middle" font-family="Arial" font-size="13">dispatch SyncMetaInsights (unique job)</text>
<polyline points="930,1158 540,1158" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="735.0" y="1154" text-anchor="middle" font-family="Arial" font-size="13">redirect back</text>
<polyline points="540,1243 150,1243" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="345.0" y="1239" text-anchor="middle" font-family="Arial" font-size="13">display current saved metrics</text>
<rect x="1704" y="1328" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1328 1710,1328" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="1324" text-anchor="middle" font-family="Arial" font-size="13">read selected social_connections</text>
<polyline points="1710,1413 1320,1413" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1515.0" y="1409" text-anchor="middle" font-family="Arial" font-size="13">return configured connections</text>
<rect x="1704" y="1608" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1608 1710,1608" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="1604" text-anchor="middle" font-family="Arial" font-size="13">set insights_status = disconnected</text>
<line x1="40" y1="1673" x2="2300" y2="1673" stroke="#64748b" stroke-dasharray="6 4"/><text x="55" y="1695" font-family="Arial" font-size="13">[connection is usable]</text>
<rect x="2094" y="1748" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1748 2100,1748" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1710.0" y="1744" text-anchor="middle" font-family="Arial" font-size="13">GET account insights (daily metrics; last 7 days)</text>
<polyline points="2100,1833 1320,1833" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1710.0" y="1829" text-anchor="middle" font-family="Arial" font-size="13">return metric series / provider error</text>
<rect x="1704" y="1991" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1991 1710,1991" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="1969" text-anchor="middle" font-family="Arial" font-size="13">transaction: lock connection; recheck identity;</text>
<text x="1515.0" y="1987" text-anchor="middle" font-family="Arial" font-size="13">upsert snapshots</text>
<rect x="1704" y="2076" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,2076 1710,2076" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="2072" text-anchor="middle" font-family="Arial" font-size="13">set insights_status = ready and insights_synced_at</text>
<polyline points="1710,2161 1320,2161" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1515.0" y="2157" text-anchor="middle" font-family="Arial" font-size="13">commit snapshots</text>
<line x1="40" y1="2226" x2="2300" y2="2226" stroke="#64748b" stroke-dasharray="6 4"/><text x="55" y="2248" font-family="Arial" font-size="13">[no data / failure / changed connection]</text>
<rect x="1704" y="2319" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,2319 1710,2319" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="2297" text-anchor="middle" font-family="Arial" font-size="13">set no_data or unavailable; discard stale-account</text>
<text x="1515.0" y="2315" text-anchor="middle" font-family="Arial" font-size="13">response</text>
<rect x="65" y="2514" width="2210" height="55" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="2536" font-family="Arial" font-size="13">A later analytics request reads these snapshots. Queue timing depends on the configured driver; with a sync driver, dispatch runs inline. No automatic UI polling is implied.</text>
