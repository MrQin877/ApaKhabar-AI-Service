<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="2684"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="40" y="47" font-family="Arial" font-size="25" font-weight="bold">Synchronize social-media analytics</text>
<text x="40" y="85" font-family="Arial" font-size="13" fill="#475569">Solid arrow: request / call     Dashed arrow: return     Frames: alternative, optional or repeated flow</text>
<rect x="40" y="290" width="2260" height="753" fill="none" stroke="#64748b"/><text x="55" y="312" font-family="Arial" font-size="13">alt [change selected accounts]</text>
<rect x="40" y="1898" width="2260" height="516" fill="none" stroke="#64748b"/><text x="55" y="1920" font-family="Arial" font-size="13">alt [valid points and same account/token still selected]</text>
<rect x="40" y="1533" width="2260" height="921" fill="none" stroke="#64748b"/><text x="55" y="1555" font-family="Arial" font-size="13">alt [connection is disconnected]</text>
<rect x="40" y="1478" width="2260" height="1016" fill="none" stroke="#64748b"/><text x="55" y="1500" font-family="Arial" font-size="13">loop [each selected connection]</text>
<line x1="150" y1="190" x2="150" y2="2649" stroke="#94a3b8" stroke-dasharray="6 5"/>
<circle cx="150" cy="143" r="10" fill="#ffd2a8" stroke="#555"/><path d="M 150 153 v 22 m -22 -12 h44 m-22 12 l-18 18 m18 -18 l18 18" fill="none" stroke="#555"/>
<text x="150" y="108" text-anchor="middle" font-family="Arial" font-size="13">Administrator</text>
