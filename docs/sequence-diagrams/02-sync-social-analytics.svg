<rect x="440" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="540" y="151" text-anchor="middle" font-family="Arial" font-size="14">Web Application</text>
<text x="540" y="170" text-anchor="middle" font-family="Arial" font-size="14">(System)</text>
<line x1="930" y1="190" x2="930" y2="2649" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="830" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="930" y="151" text-anchor="middle" font-family="Arial" font-size="14">MetaAnalyticsController</text>
