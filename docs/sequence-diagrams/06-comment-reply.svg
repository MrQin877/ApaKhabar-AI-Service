<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="2858"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="40" y="47" font-family="Arial" font-size="25" font-weight="bold">Submit a comment or reply with moderation</text>
<text x="40" y="85" font-family="Arial" font-size="13" fill="#475569">Solid arrow: request / call     Dashed arrow: return     Frames: alternative, optional or repeated flow</text>
<rect x="40" y="478" width="2260" height="438" fill="none" stroke="#64748b"/><text x="55" y="500" font-family="Arial" font-size="13">opt [guest reader]</text>
<rect x="40" y="1382" width="2260" height="395" fill="none" stroke="#64748b"/><text x="55" y="1404" font-family="Arial" font-size="13">alt [moderation API key configured]</text>
<rect x="40" y="2328" width="2260" height="170" fill="none" stroke="#64748b"/><text x="55" y="2350" font-family="Arial" font-size="13">opt [guest submission succeeded]</text>
<line x1="150" y1="190" x2="150" y2="2823" stroke="#94a3b8" stroke-dasharray="6 5"/>
<circle cx="150" cy="143" r="10" fill="#ffd2a8" stroke="#555"/><path d="M 150 153 v 22 m -22 -12 h44 m-22 12 l-18 18 m18 -18 l18 18" fill="none" stroke="#555"/>
<text x="150" y="108" text-anchor="middle" font-family="Arial" font-size="13">Reader</text>
<text x="150" y="123" text-anchor="middle" font-family="Arial" font-size="13">(Guest / signed-in)</text>
<line x1="540" y1="190" x2="540" y2="2823" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="440" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="540" y="151" text-anchor="middle" font-family="Arial" font-size="14">Web Application</text>
<text x="540" y="170" text-anchor="middle" font-family="Arial" font-size="14">(News UI)</text>
<line x1="930" y1="190" x2="930" y2="2823" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="830" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="930" y="151" text-anchor="middle" font-family="Arial" font-size="14">CommentController /</text>
<text x="930" y="170" text-anchor="middle" font-family="Arial" font-size="14">GuestCommentIdentity</text>
<line x1="1320" y1="190" x2="1320" y2="2823" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="1220" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="1320" y="151" text-anchor="middle" font-family="Arial" font-size="14">InteractionService /</text>
<text x="1320" y="170" text-anchor="middle" font-family="Arial" font-size="14">CommentModeration</text>
<line x1="1710" y1="190" x2="1710" y2="2823" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="1610" y="125" width="200" height="65" fill="#dae8fc" stroke="#64748b"/>
<text x="1710" y="151" text-anchor="middle" font-family="Arial" font-size="14">Application Database</text>
<line x1="2100" y1="190" x2="2100" y2="2823" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="2000" y="125" width="200" height="65" fill="#fff2cc" stroke="#64748b"/>
<text x="2100" y="151" text-anchor="middle" font-family="Arial" font-size="14">Moderation API</text>
<text x="2100" y="170" text-anchor="middle" font-family="Arial" font-size="14">(OpenAI)</text>
<rect x="534" y="225" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="150,225 540,225" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="345.0" y="221" text-anchor="middle" font-family="Arial" font-size="13">enter comment or reply</text>
<rect x="924" y="310" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="540,310 930,310" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="735.0" y="306" text-anchor="middle" font-family="Arial" font-size="13">POST /news/{id}/comment or /comments/{id}/replies</text>
<rect x="924" y="438" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,413 975,413 975,438 930,438" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="985" y="391" text-anchor="start" font-family="Arial" font-size="13">validate content; resolve published</text>
<text x="985" y="409" text-anchor="start" font-family="Arial" font-size="13">parent for replies</text>
<rect x="924" y="596" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,571 975,571 975,596 930,596" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="985" y="549" text-anchor="start" font-family="Arial" font-size="13">validate challenge age 3s–2h, news ID</text>
<text x="985" y="567" text-anchor="start" font-family="Arial" font-size="13">and session</text>
<rect x="1704" y="656" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,656 1710,656" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1320.0" y="652" text-anchor="middle" font-family="Arial" font-size="13">find/create guest identity; lock identity; read daily quota</text>
<polyline points="1710,741 930,741" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1320.0" y="737" text-anchor="middle" font-family="Arial" font-size="13">return username and comment_count</text>
<rect x="65" y="816" width="2210" height="55" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="838" font-family="Arial" font-size="13">Invalid challenge or quota of 3/day reached: stop with validation error. Guest quota day uses Asia/Jakarta in the implementation.</text>
<rect x="1314" y="946" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,946 1320,946" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1125.0" y="942" text-anchor="middle" font-family="Arial" font-size="13">addComment(...) / addReply(...)</text>
<rect x="1704" y="1049" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1049 1710,1049" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="1027" text-anchor="middle" font-family="Arial" font-size="13">verify active news; check duplicate</text>
<text x="1515.0" y="1045" text-anchor="middle" font-family="Arial" font-size="13">submission_hash</text>
<polyline points="1710,1134 1320,1134" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1515.0" y="1130" text-anchor="middle" font-family="Arial" font-size="13">return eligibility and duplicate result</text>
<rect x="65" y="1209" width="2210" height="55" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="1231" font-family="Arial" font-size="13">Duplicate content stops with validation error. Replies must reference a published parent.</text>
<rect x="1314" y="1342" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1317 1365,1317 1365,1342 1320,1342" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1375" y="1295" text-anchor="start" font-family="Arial" font-size="13">check(content): detect suspicious</text>
<text x="1375" y="1313" text-anchor="start" font-family="Arial" font-size="13">links / promotion</text>
<rect x="2094" y="1457" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1457 2100,1457" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1710.0" y="1453" text-anchor="middle" font-family="Arial" font-size="13">POST /v1/moderations (omni-moderation-latest, content)</text>
<polyline points="2100,1542 1320,1542" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1710.0" y="1538" text-anchor="middle" font-family="Arial" font-size="13">return flags / categories, or error</text>
<line x1="40" y1="1607" x2="2300" y2="1607" stroke="#64748b" stroke-dasharray="6 4"/><text x="55" y="1629" font-family="Arial" font-size="13">[no moderation key]</text>
<rect x="1314" y="1707" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1682 1365,1682 1365,1707 1320,1707" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1375" y="1678" text-anchor="start" font-family="Arial" font-size="13">use pending_review fallback</text>
<rect x="1314" y="1850" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,1825 1365,1825 1365,1850 1320,1850" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1375" y="1803" text-anchor="start" font-family="Arial" font-size="13">choose published only if clean, valid</text>
<text x="1375" y="1821" text-anchor="start" font-family="Arial" font-size="13">and not suspicious</text>
<rect x="65" y="1900" width="2210" height="55" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="1922" font-family="Arial" font-size="13">Flagged, suspicious, unavailable or malformed results remain pending_review. The Laravel moderation service calls this API directly; it does not call the project AI service.</text>
<rect x="1704" y="2008" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,2008 1710,2008" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="1986" text-anchor="middle" font-family="Arial" font-size="13">transaction: lock news; recheck duplicate; insert</text>
<text x="1515.0" y="2004" text-anchor="middle" font-family="Arial" font-size="13">comment</text>
<rect x="1704" y="2093" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="1320,2093 1710,2093" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1515.0" y="2089" text-anchor="middle" font-family="Arial" font-size="13">insert initial comment_moderation_history</text>
<polyline points="1710,2178 1320,2178" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1515.0" y="2174" text-anchor="middle" font-family="Arial" font-size="13">return saved comment</text>
<polyline points="1320,2263 930,2263" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1125.0" y="2259" text-anchor="middle" font-family="Arial" font-size="13">return status</text>
<rect x="1704" y="2403" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,2403 1710,2403" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1320.0" y="2399" text-anchor="middle" font-family="Arial" font-size="13">increment guest_comment_days; commit guest transaction</text>
<polyline points="930,2528 540,2528" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="735.0" y="2524" text-anchor="middle" font-family="Arial" font-size="13">201: status, remaining_quota and confirmation</text>
<polyline points="540,2613 150,2613" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="345.0" y="2609" text-anchor="middle" font-family="Arial" font-size="13">show published or awaiting-review confirmation</text>
<rect x="65" y="2688" width="2210" height="55" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="2710" font-family="Arial" font-size="13">Short-video comments use ShortCommentService with short_video_comments / short_video_comment_history and the shared moderation and guest-identity services.</text>
</svg>