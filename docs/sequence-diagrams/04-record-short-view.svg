<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="2209"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="40" y="47" font-family="Arial" font-size="25" font-weight="bold">Record a short-video view</text>
<text x="40" y="85" font-family="Arial" font-size="13" fill="#475569">Solid arrow: request / call     Dashed arrow: return     Frames: alternative, optional or repeated flow</text>
<rect x="40" y="1469" width="1480" height="170" fill="none" stroke="#64748b"/><text x="55" y="1491" font-family="Arial" font-size="13">opt [first recorded view for this viewer]</text>
<rect x="40" y="1001" width="1480" height="1018" fill="none" stroke="#64748b"/><text x="55" y="1023" font-family="Arial" font-size="13">alt [invalid token]</text>
<line x1="150" y1="190" x2="150" y2="2174" stroke="#94a3b8" stroke-dasharray="6 5"/>
<circle cx="150" cy="143" r="10" fill="#ffd2a8" stroke="#555"/><path d="M 150 153 v 22 m -22 -12 h44 m-22 12 l-18 18 m18 -18 l18 18" fill="none" stroke="#555"/>
<text x="150" y="108" text-anchor="middle" font-family="Arial" font-size="13">Viewer</text>
<text x="150" y="123" text-anchor="middle" font-family="Arial" font-size="13">(Guest / signed-in)</text>
<line x1="540" y1="190" x2="540" y2="2174" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="440" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="540" y="151" text-anchor="middle" font-family="Arial" font-size="14">Web Application</text>
<text x="540" y="170" text-anchor="middle" font-family="Arial" font-size="14">(Short-video player)</text>
<line x1="930" y1="190" x2="930" y2="2174" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="830" y="125" width="200" height="65" fill="#e2f0d9" stroke="#64748b"/>
<text x="930" y="151" text-anchor="middle" font-family="Arial" font-size="14">ShortViewerController</text>
<line x1="1320" y1="190" x2="1320" y2="2174" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="1220" y="125" width="200" height="65" fill="#dae8fc" stroke="#64748b"/>
<text x="1320" y="151" text-anchor="middle" font-family="Arial" font-size="14">Application Database</text>
<rect x="534" y="225" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="150,225 540,225" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="345.0" y="221" text-anchor="middle" font-family="Arial" font-size="13">open and play a published short video</text>
<rect x="924" y="310" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="540,310 930,310" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="735.0" y="306" text-anchor="middle" font-family="Arial" font-size="13">GET /shorts/{id}/view-token</text>
<rect x="1314" y="395" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,395 1320,395" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1125.0" y="391" text-anchor="middle" font-family="Arial" font-size="13">verify published video and published_at</text>
<polyline points="1320,480 930,480" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1125.0" y="476" text-anchor="middle" font-family="Arial" font-size="13">return video</text>
<rect x="924" y="608" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,583 975,583 975,608 930,608" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="985" y="561" text-anchor="start" font-family="Arial" font-size="13">create viewer key and session-bound</text>
<text x="985" y="579" text-anchor="start" font-family="Arial" font-size="13">encrypted token</text>
<polyline points="930,668 540,668" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="735.0" y="664" text-anchor="middle" font-family="Arial" font-size="13">return token; set short_visitor cookie</text>
<rect x="65" y="743" width="1430" height="55" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="765" font-family="Arial" font-size="13">The player tracks qualified visible playback before submitting a view. Server accepts token age 5 seconds to 2 hours.</text>
<rect x="924" y="833" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="540,833 930,833" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="735.0" y="829" text-anchor="middle" font-family="Arial" font-size="13">POST /shorts/{id}/view (token)</text>
<rect x="924" y="961" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,936 975,936 975,961 930,961" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="985" y="914" text-anchor="start" font-family="Arial" font-size="13">validate video, age, current viewer</text>
<text x="985" y="932" text-anchor="start" font-family="Arial" font-size="13">and session</text>
<polyline points="930,1076 540,1076" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="735.0" y="1072" text-anchor="middle" font-family="Arial" font-size="13">422: reject request</text>
<line x1="40" y1="1141" x2="1520" y2="1141" stroke="#64748b" stroke-dasharray="6 4"/><text x="55" y="1163" font-family="Arial" font-size="13">[valid token]</text>
<rect x="1314" y="1216" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,1216 1320,1216" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1125.0" y="1212" text-anchor="middle" font-family="Arial" font-size="13">begin transaction; lock published short_videos row</text>
<rect x="1314" y="1319" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,1319 1320,1319" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1125.0" y="1297" text-anchor="middle" font-family="Arial" font-size="13">insertOrIgnore short_video_viewers(video_id,</text>
<text x="1125.0" y="1315" text-anchor="middle" font-family="Arial" font-size="13">viewer_key)</text>
<polyline points="1320,1404 930,1404" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1125.0" y="1400" text-anchor="middle" font-family="Arial" font-size="13">return whether a row was inserted</text>
<rect x="1314" y="1544" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,1544 1320,1544" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1125.0" y="1540" text-anchor="middle" font-family="Arial" font-size="13">increment short_videos.view_count</text>
<rect x="1314" y="1669" width="12" height="28" fill="white" stroke="#64748b"/>
<polyline points="930,1669 1320,1669" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="1125.0" y="1665" text-anchor="middle" font-family="Arial" font-size="13">commit; read view_count</text>
<polyline points="1320,1754 930,1754" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="1125.0" y="1750" text-anchor="middle" font-family="Arial" font-size="13">return view_count</text>
<polyline points="930,1839 540,1839" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="735.0" y="1835" text-anchor="middle" font-family="Arial" font-size="13">JSON: view_count</text>
<polyline points="540,1924 150,1924" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="345.0" y="1920" text-anchor="middle" font-family="Arial" font-size="13">update displayed count</text>
<rect x="65" y="2039" width="1430" height="55" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="2061" font-family="Arial" font-size="13">Short-video view_count is deduplicated by (short_video_id, viewer_key). Unlike news, this flow has no separate news_visits-style total-visit counter.</text>
</svg>