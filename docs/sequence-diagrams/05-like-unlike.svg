<polyline points="930,1696 540,1696" fill="none" stroke="#333" stroke-width="1.2" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="735.0" y="1692" text-anchor="middle" font-family="Arial" font-size="13">JSON: liked, likes_count</text>
