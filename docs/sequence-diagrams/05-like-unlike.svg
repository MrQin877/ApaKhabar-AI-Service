<rect x="65" y="1856" width="1820" height="64" fill="#fffbea" stroke="#c9b975"/>
<text x="77" y="1878" font-family="Arial" font-size="13">Comment likes are counted directly; there is no cached comments.likes_count column. Unauthenticated requests stop at middleware. Short-video equivalents use ShortEngagementController and short_video_likes / short_video_comment_likes, with</text>
<text x="77" y="1900" font-family="Arial" font-size="13">the same toggle pattern.</text>
