<text x="77" y="4434" font-family="Arial" font-size="13">This use case summarizes independent reader interactions. Human moderation happens later; no reader request waits for a moderator. Reviewers can create comment_flags separately. Unavailable AI moderation leaves comments pending_review.</text>
